name: Sync OSCam with Streamboard

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Synchronize OSCam master
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v5

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize target repository
        env:
          GH_TOKEN: ${{ secrets.OSCAM_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git clone "https://x-access-token:${GH_TOKEN}@github.com/speedy005/oscam-git.git" target
          cd target

          git remote add upstream https://git.streamboard.tv/common/oscam.git
          git fetch --no-tags upstream master

          UPSTREAM_COMMIT="$(git rev-parse upstream/master)"
          echo "Streamboard commit: $UPSTREAM_COMMIT"

          git checkout -B master "$UPSTREAM_COMMIT"
          git push --force origin master

          git fetch --no-tags origin master
          LOCAL_COMMIT="$(git rev-parse origin/master)"

          if [ "$LOCAL_COMMIT" != "$UPSTREAM_COMMIT" ]; then
            echo "::error::GitHub master does not match Streamboard master."
            exit 1
          fi

          echo "Synchronization successful: $LOCAL_COMMIT"
